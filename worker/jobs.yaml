apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-0
  namespace: pipeline
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: command-parser-service:latest
          imagePullPolicy: Never
          command: ["python", "worker/label_worker.py"]
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: S3_ENDPOINT
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
            - name: OLLAMA_URL
              value: "http://host.k3d.internal:11434/api/generate"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-1
  namespace: pipeline
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: command-parser-service:latest
          imagePullPolicy: Never
          command: ["python", "worker/label_worker.py"]
          env:
            - name: SHARD_INDEX
              value: "1"
            - name: SHARD_COUNT
              value: "2"
            - name: S3_ENDPOINT
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
            - name: OLLAMA_URL
              value: "http://host.k3d.internal:11434/api/generate"
