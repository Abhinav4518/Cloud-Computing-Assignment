apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-parser
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-api
  template:
    metadata:
      labels:
        app: student-api
    spec:
      volumes:
      - name: ram-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      containers:
      - name: api
        image: command-parser-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: ram-tmp
          mountPath: /tmp
        env:
        - name: S3_ENDPOINT
          value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
        - name: AWS_ACCESS_KEY_ID
          value: "any"
        - name: AWS_SECRET_ACCESS_KEY
          value: "any"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        - name: AWS_REGION
          value: "us-east-1"
        - name: MODEL_URI
          value: "s3://models/v1"
        - name: MODEL_VERSION
          value: "v1"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 40
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "2"
            memory: "2.5Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: command-parser-svc
  namespace: pipeline
spec:
  selector:
    app: student-api
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: command-parser-ingress
  namespace: pipeline
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: command-parser-svc
            port:
              number: 80
