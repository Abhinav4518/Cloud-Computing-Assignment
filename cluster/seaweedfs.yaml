apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.69
          args: ["server", "-s3", "-dir=/data", "-s3.port=8333"]
          ports:
            - containerPort: 8333
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: data
spec:
  type: NodePort
  selector:
    app: seaweedfs
  ports:
    - port: 8333
      targetPort: 8333
      nodePort: 30833
